networks:
  pulsehive-mesh:
    driver: bridge

services:

  # --------------------------------------------------
  # RabbitMQ
  # --------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pulsehive-rabbitmq
    user: "999:999"
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - pulsehive-mesh
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # --------------------------------------------------
  # PostgreSQL
  # --------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pulsehive-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - pulsehive-mesh
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/db/config/init.sql:/docker-entrypoint-initdb.d/init.sql

  # --------------------------------------------------
  # DB Service
  # --------------------------------------------------
  db:
    build:
      context: ./services/db
      dockerfile: Dockerfile
    container_name: pulsehive-db
    ports:
      - "4003:4003"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 4003
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pulsehive-mesh
    develop:
      watch:
        - path: ./services/db
          target: /app
          action: sync
          ignore:
            - node_modules/
            - dist/
        - path: ./services/db/package.json
          action: rebuild
        - path: ./services/db/pnpm-lock.yaml
          action: rebuild

  # --------------------------------------------------
  # Auth
  # --------------------------------------------------
  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
      args:
        CI: "true"
    container_name: pulsehive-auth
    ports:
      - "4001:4001"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 4001
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    command: sh -c "pnpm start:dev"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pulsehive-mesh
    develop:
      watch:
        - path: ./services/auth
          target: /app
          action: sync
          ignore:
            - node_modules/
        - path: ./services/auth/package.json
          action: rebuild
        - path: ./services/auth/pnpm-lock.yaml
          action: rebuild

  # --------------------------------------------------
  # Orders
  # --------------------------------------------------
  orders:
    build:
      context: ./services/orders
      dockerfile: Dockerfile
    container_name: pulsehive-orders
    ports:
      - "4002:4002"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 4002
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      postgres:
        condition: service_healthy
      events:
        condition: service_healthy
    networks:
      - pulsehive-mesh
    develop:
      watch:
        - path: ./services/orders
          target: /app
          action: sync
          ignore:
            - node_modules/
        - path: ./services/orders/package.json
          action: rebuild
        - path: ./services/orders/pnpm-lock.yaml
          action: rebuild

  # --------------------------------------------------
  # Events
  # --------------------------------------------------
  events:
    build:
      context: ./services/events
      dockerfile: Dockerfile
    container_name: pulsehive-events
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 5000
      RABBITMQ_URL: ${RABBITMQ_URL}
    command: sh -c "pnpm start:dev"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:5000/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - pulsehive-mesh

  # --------------------------------------------------
  # API
  # --------------------------------------------------
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
      args:
        CI: "true"
    container_name: pulsehive-api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${API_PORT}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      AUTH_SERVICE_URL: ${PULSEHIVE_AUTH_SERVICE_URL}
      ORDER_SERVICE_URL: ${PULSEHIVE_ORDERS_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      auth:
        condition: service_started
      orders:
        condition: service_started
    networks:
      - pulsehive-mesh
    develop:
      watch:
        - path: ./services/api
          target: /app
          action: sync
          ignore:
            - node_modules/
        - path: ./services/api/package.json
          action: rebuild
        - path: ./services/api/pnpm-lock.yaml
          action: rebuild

  # --------------------------------------------------
  # Web
  # --------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: pulsehive-web
    ports:
      - "3000:3000"
    command: pnpm exec next dev -H 0.0.0.0
    depends_on:
      api:
        condition: service_started
    environment:
      PULSEHIVE_TENANT_CODE: ${PULSEHIVE_TENANT_CODE}
      PULSEHIVE_DB_SERVICE_URL: ${PULSEHIVE_DB_SERVICE_URL}
      PULSEHIVE_ORDERS_SERVICE_URL: ${PULSEHIVE_ORDERS_SERVICE_URL}
      PULSEHIVE_EVENTS_SERVICE_URL: ${PULSEHIVE_EVENTS_SERVICE_URL}
      NODE_ENV: ${NODE_ENV}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING}
      NODE_OPTIONS: --max-old-space-size=4096
      PNPM_DISABLE_CHECK_UPDATE: "true"
      CI: "true"
    networks:
      - pulsehive-mesh
    develop:
      watch:
        - path: ./apps/web
          target: /app
          action: sync
          ignore:
            - node_modules/
            - .next/
            - pnpm-lock.yaml
            - Dockerfile
        - path: ./apps/web/package.json
          target: /app/package.json
          action: rebuild
        - path: ./apps/web/pnpm-lock.yaml
          target: /app/pnpm-lock.yaml
          action: rebuild

  # --------------------------------------------------
  # Admin
  # --------------------------------------------------
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: pulsehive-admin
    ports:
      - "3001:3001"
    command: pnpm dev
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3001
      WATCHPACK_POLLING: ${WATCHPACK_POLLING}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING}
    networks:
      - pulsehive-mesh
    develop:
      watch:
        - path: ./apps/admin
          target: /app
          action: sync
          ignore:
            - node_modules/
            - .next/
        - path: ./apps/admin/package.json
          action: rebuild
        - path: ./apps/admin/pnpm-lock.yaml
          action: rebuild

volumes:
  postgres_data:
  rabbitmq_data: