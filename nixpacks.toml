[phases.setup]
# This forces the cloud engine to inject the Node environment and PNPM globally at the root
nixPkgs = ["nodejs", "pnpm"]

[phases.install]
# Force the system to change into your directory to run the isolated installation
cmd = "cd apps/web && pnpm install --frozen-lockfile"

[phases.build]
# Navigate inside the folder to compile your production assets 
cmd = "cd apps/web && pnpm build"

[start]
# Launch Next.js in production mode inside the correct directory
cmd = "cd apps/web && pnpm start"
